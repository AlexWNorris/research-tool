<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}University of Exeter Research{% endblock %}</title>
    <!-- Favicon could be added here -->

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>

    <header>
        <div class="container">
            <!-- Ensure exact path to logo matches file system -->
            <img src="{{ url_for('static', filename='img/university logo.png') }}" alt="University of Exeter"
                class="university-logo">
            {% if current_step %}
            <div class="progress-bar-wrapper">
                <div class="progress-bar-label">Your Progress</div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" style="width: {{ ((current_step / total_steps) * 100) | round | int }}%;"></div>
                </div>
                <div class="progress-bar-text">Step {{ current_step }} of {{ total_steps }}</div>
            </div>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ now.year if now else 2026 }} University of Exeter. All rights reserved.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
