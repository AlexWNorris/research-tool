<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}University of Exeter Research{% endblock %}</title>
    <!-- Favicon could be added here -->

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>

    <header>
        <div class="container">
            <!-- Ensure exact path to logo matches file system -->
            <img src="{{ url_for('static', filename='img/university logo.png') }}" alt="University of Exeter"
                class="university-logo">
            {% if current_step %}
            <div class="progress-counter">
                {% for i in range(1, total_steps + 1) %}
                <div class="progress-circle {% if i == current_step %}active{% endif %}">
                    {{ i }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ now.year if now else 2026 }} University of Exeter. All rights reserved.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
