{% extends "base.html" %}

{% block title %}Survey - University of Exeter Research{% endblock %}

{% block content %}
<div class="container card card-sm">
    <h2 class="text-center">Demographic Survey</h2>
    <p class="text-center mb-2">Please answer the following questions.</p>

    <form action="{{ url_for('survey') }}" method="POST">

        <div class="form-group">
            <label for="age">What is your age group?</label>
            <select id="age" name="age" required>
                <option value="" disabled selected hidden>Select your age group...</option>
                <option value="18-24">18-24</option>
                <option value="25-34">25-34</option>
                <option value="35-44">35-44</option>
                <option value="45-54">45-54</option>
                <option value="55-64">55-64</option>
                <option value="65 or older">65 or older</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gender">How would you describe your gender?</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected hidden>Select your gender...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">What was your total household income before taxes during the past 12 months?</label>
            <select id="income" name="income" required>
                <option value="" disabled selected hidden>Select an income range...</option>
                <option value="Less than £15,000">Less than £15,000</option>
                <option value="15,000 - £24,999">15,000 - £24,999</option>
                <option value="£25,000 - £34,999">£25,000 - £34,999</option>
                <option value="£35,000 - £44,999">£35,000 - £44,999</option>
                <option value="£45,000 - £54,999">£45,000 - £54,999</option>
                <option value="£55,000 or more">£55,000 or more</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
        </div>

        <div class="form-group">
            <label for="education">what is the highest level of education you have completed?</label>
            <select id="education" name="education" required>
                <option value="" disabled selected hidden>Select your education level...</option>
                <option value="School-level">School-level qualifications (e.g., GCSEs, O-Levels)</option>
                <option value="Further Education">Further Education / Advanced qualifications (e.g., A-Levels, BTEC)
                </option>
                <option value="Higher Education">Higher Education (University-level, e.g., HND, Foundation Degree)
                </option>
                <option value="Bachelor's Degree">Bachelor's Degree (e.g., BA, BSc, BEng)</option>
                <option value="Postgraduate Degree">Postgraduate Degree (e.g., MA, MSc, PhD)</option>
                <option value="No formal qualifications">No formal qualifications</option>
            </select>
        </div>

        <div class="form-group">
            <label for="email">
                Withdrawal Email Address
                <span style="color: #6c757d; font-size: 0.9em; font-weight: normal;">(optional)</span>
                <div class="tooltip-container">
                    <span class="tooltip-icon">?</span>
                    <span class="tooltip-text">
                        <strong>Withdrawal Email:</strong><br>
                        This email will only be used if you wish to withdraw your data from the study later. It links
                        your response to you without compromising your anonymity.
                    </span>
                </div>
            </label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email (optional)">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Survey</button>
    </form>
</div>
{% endblock %}
